<!--
============================================================
CHAPTER FILE TEMPLATE — COPY THIS FOR EVERY NEW CHAPTER
============================================================

HOW TO USE THIS FILE
1. Make a copy inside this "chapters" folder.
2. Rename the copy to match the id in chapters.js.
   Example: chapter-04.html
3. Change the chapter number and heading below.
4. Replace the sample paragraphs with your manuscript.
5. Add a scene break only where a new scene begins (not automatically after the heading).
   Insert this one-line component between paragraphs:
   <orlong-scene-break variant="electric-eel"></orlong-scene-break>
6. Add the chapter to ../chapters.js and set available: true.
7. Add Companion definitions to that chapter's companionTerms list in chapters.js.
8. Add a "triggers" array to each Companion definition. These are the words
   and phrases that should open that entry (for example: ["Maya", "Maya Garcia"]).
   Matching phrases are automatically highlighted in the manuscript.
   The Companion entry only appears if at least one trigger occurs in the chapter.

EXAMPLE COMPANION ENTRY IN chapters.js:
{
  id: "maya-garcia",
  term: "Maya Garcia",
  triggers: ["Maya", "Maya Garcia"],
  category: "CHARACTER",
  description: "The protagonist of the story."
}

IMPORTANT
- Keep the "chapter-document" class on the article.
- Keep the "chapterText" id on the manuscript container.
- Use one <p>...</p> block for each paragraph.
- Do not put a scene break directly below the chapter heading unless the story genuinely begins after a scene transition.
- Put every scene break between paragraphs, inside <div class="chapter-text" id="chapterText">.
- Do not add <html>, <head>, or <body> tags here.

SCENE BREAK COMPONENT
The one-line element above automatically inserts the Electric Eel illustration.
The reusable design is defined in ../scene-breaks.js, so do not copy the SVG
into each chapter. Keep the component between paragraphs inside chapter-text.
============================================================
============================================================
-->

<article class="chapter-document" data-chapter-id="chapter-01">

  <!-- CHAPTER HEADING: Update the number and title here. -->
  <header class="chapter-heading">
    <div class="chapter-number">CHAPTER ONE</div>
    <h2>YOUR CHAPTER TITLE</h2>
    <p>Written by Callum Macann</p>
  </header>

  <!-- MANUSCRIPT: Replace these examples with your own paragraphs. -->
  <div class="chapter-text" id="chapterText">

    <p>
      Your first paragraph goes here. Maya Garcia.
    </p>

    <p>
      Your second paragraph goes here. Xantheon.
    </p>

    <!-- SCENE BREAK: Use this only when the scene changes. -->
    <orlong-scene-break variant="electric-eel"></orlong-scene-break>

    <p>
      Your next scene begins here.
    </p>

    <!-- ADD MORE PARAGRAPHS BY COPYING A <p> BLOCK ABOVE. -->

    <!-- EXAMPLE TRIGGER: Wrap a name or term to make it clickable.
    <p><button type="button" class="companion-trigger" data-companion-term="maya-garcia">Maya Garcia</button> entered the facility.</p>
    The id must also exist in this chapter's companionTerms list in chapters.js.
    -->

  </div>
</article>
